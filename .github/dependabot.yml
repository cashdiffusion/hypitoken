version: 2

# Weekly dependency PRs grouped by ecosystem so we don't drown in tiny bumps.
# Conservative cadence — we ship serial releases, not a fire hose.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /internal/admin/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps-web)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      gha:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
