{{define "title"}}{{if .IsNew}}上架商品{{else}}编辑商品{{end}} · {{.SiteName}}{{end}}
{{define "content"}}
{{$p := .P}}
<a href="/admin" class="inline-flex items-center gap-1.5 eyebrow hover:text-ink transition-colors mb-5">
  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>后台
</a>
<h1 class="font-display text-3xl font-semibold tracking-tight mb-6 reveal">{{if .IsNew}}上架新商品{{else}}编辑商品{{end}}</h1>

<div class="grid lg:grid-cols-2 gap-5 items-start">
  <!-- Images -->
  {{if not .IsNew}}
  <div class="card shadow-soft p-4 reveal lg:order-2 lg:sticky lg:top-[78px]">
    <div class="rule eyebrow mb-3"><span>图片 · 最多 8 张</span></div>
    <div class="grid grid-cols-3 gap-2 mb-3">
      {{range $p.Images}}
      <div class="relative aspect-square rounded-xl overflow-hidden border" style="border-color:var(--line-strong);">
        <img src="/img/{{$p.ID}}/{{.}}" class="w-full h-full object-cover">
        <form method="POST" action="/admin/products/{{$p.ID}}/images/delete" class="absolute top-1.5 right-1.5">
          <input type="hidden" name="file" value="{{.}}">
          <button type="submit" class="w-6 h-6 rounded-full text-white text-[11px] flex items-center justify-center shadow-lift" style="background:var(--vermilion);" onclick="return confirm('删除这张图片?')">✕</button>
        </form>
      </div>
      {{else}}
      <div class="col-span-3 aspect-[3/1] rounded-xl border border-dashed flex items-center justify-center text-xs text-ink-soft" style="border-color:var(--line-strong);">还没有图片</div>
      {{end}}
    </div>
    <form method="POST" action="/admin/products/{{$p.ID}}/images" enctype="multipart/form-data" id="imgf">
      <label class="btn-ghost cursor-pointer w-full">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        拍照 / 选图上传
        <input type="file" name="images" accept="image/*" capture="environment" multiple class="hidden" onchange="document.getElementById('imgf').submit()">
      </label>
    </form>
  </div>
  {{end}}

  <!-- Form -->
  <form method="POST" action="{{if .IsNew}}/admin/products{{else}}/admin/products/{{$p.ID}}{{end}}" class="card shadow-soft p-5 space-y-4 reveal lg:order-1">
    <div>
      <label class="lbl">商品名称</label>
      <input type="text" name="name" class="field" value="{{$p.Name}}" placeholder="例如:九成新护眼台灯" required>
    </div>
    <div>
      <label class="lbl">商品介绍</label>
      <textarea name="description" rows="5" class="field" placeholder="成色、规格、购买时间、议价空间等">{{$p.Description}}</textarea>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="lbl">价格 ¥</label><input type="number" step="0.01" min="0.01" name="price" class="field num" value="{{if $p.Price}}{{printf "%.2f" $p.Price}}{{end}}" placeholder="0.00" required></div>
      <div><label class="lbl">数量</label><input type="number" step="1" min="1" name="quantity" class="field num" value="{{if $p.Quantity}}{{$p.Quantity}}{{else}}1{{end}}"></div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="lbl">定金比例 %</label><input type="number" step="0.1" min="0.1" max="100" name="deposit_pct" class="field num" value="{{printf "%g" (mul $p.DepositRatio 100)}}" placeholder="10"></div>
      <div><label class="lbl">排序 · 小在前</label><input type="number" step="1" name="sort_order" class="field num" value="{{$p.SortOrder}}"></div>
    </div>
    <label class="choice">
      <input type="checkbox" name="active" {{if $p.Active}}checked{{end}}>
      <span class="font-medium text-sm">上架展示 <span class="text-ink-soft font-normal">· 取消则下架隐藏</span></span>
    </label>
    <button type="submit" class="btn">{{if .IsNew}}创建并继续添加图片{{else}}保存修改{{end}}</button>
  </form>
</div>

{{if not .IsNew}}
<form method="POST" action="/admin/products/{{$p.ID}}/delete" class="mt-4 max-w-md" onsubmit="return confirm('确定删除该商品?不可撤销。')">
  <button type="submit" class="btn-danger w-full">删除该商品</button>
</form>
{{end}}
{{end}}
